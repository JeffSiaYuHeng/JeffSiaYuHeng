name: Profile commit activity

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-activity.yml'
      - 'scripts/update-commit-activity.py'

concurrency:
  group: profile-commit-activity
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh public commit count
        run: python3 scripts/update-commit-activity.py
      - name: Publish updated card
        run: |
          if git diff --quiet -- assets/commit-activity.svg; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/commit-activity.svg
          git commit -m "Refresh public commit activity"
          git push
