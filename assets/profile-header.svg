<svg xmlns="http://www.w3.org/2000/svg" width="880" height="238" viewBox="0 0 880 238" role="img" aria-labelledby="title description">
  <title id="title">Jeff Sia Yu Heng</title>
  <desc id="description">Full Stack AI Engineer and creator of ONOTAPE. Two cassette reels turn as the tape deck powers on.</desc>
  <defs>
    <linearGradient id="case" x2="0" y2="1">
      <stop stop-color="#292d2b"/>
      <stop offset="1" stop-color="#111614"/>
    </linearGradient>
    <linearGradient id="glass" x2=".9" y2="1">
      <stop stop-color="#242d28"/>
      <stop offset="1" stop-color="#111814"/>
    </linearGradient>
    <g id="spindle">
      <circle r="23" fill="#9dada5" stroke="#d5e0d9" stroke-width="1"/>
      <circle r="16" fill="#17251e" stroke="#698777"/>
      <path d="M0-14v7m12 14-6-3m-12 0-6 3" fill="none" stroke="#c0dac9" stroke-width="4" stroke-linecap="round"/>
      <circle r="4" fill="#111c16"/>
    </g>
    <style>
      @keyframes reel-start { from { transform: rotate(0deg); } to { transform: rotate(480deg); } }
      @keyframes level-start { from { transform: scaleY(.1); } to { transform: scaleY(1); } }
      .spindle { transform-origin: 0 0; animation: reel-start 3.8s cubic-bezier(.2,.5,.24,1) both; }
      .takeup { animation-duration: 3.5s; }
      .level { transform-box: fill-box; transform-origin: center bottom; animation: level-start 1.5s .25s ease-out both; }
      @media (prefers-reduced-motion: reduce) { .spindle, .level { animation: none; } }
    </style>
  </defs>
  <rect width="880" height="238" rx="14" fill="url(#case)"/>
  <rect x="1" y="1" width="878" height="236" rx="13" fill="none" stroke="#697972"/>
  <path d="M27 205h826" stroke="#45554c"/>
  <path d="M32 37v143" stroke="#8be7b5" stroke-width="3"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <text x="54" y="100" fill="#f0f2ed" font-size="46" font-weight="700">Jeff Sia Yu Heng</text>
    <text x="55" y="138" fill="#a9ddbc" font-size="19">Full Stack AI Engineer</text>
    <text x="55" y="168" fill="#bec9c2" font-size="17">Creator of ONOTAPE</text>
  </g>
  <rect x="567" y="35" width="278" height="146" rx="7" fill="#aab1a7" stroke="#d1d6cb"/>
  <rect x="579" y="47" width="254" height="103" rx="4" fill="url(#glass)" stroke="#67766d"/>
  <path d="M635 63h139m-139 70h139" fill="none" stroke="#805e43" stroke-width="2"/>
  <circle cx="635" cy="98" r="36" fill="#282420" stroke="#7d6c56" stroke-width="3"/>
  <circle cx="774" cy="98" r="35" fill="#282420" stroke="#7d6c56" stroke-width="3"/>
  <g transform="translate(635 98)"><g class="spindle"><use href="#spindle"/></g></g>
  <g transform="translate(774 98)"><g class="spindle takeup"><use href="#spindle"/></g></g>
  <path d="M687 118V95h5v23zm8 0V83h5v35zm8 0V75h5v43zm8 0V88h5v30zm8 0V100h5v18z" class="level" fill="#8be7b5"/>
  <circle cx="590" cy="164" r="3" fill="#3a5848"/>
  <text x="605" y="168" fill="#23352b" font-family="monospace" font-size="13" font-weight="700" letter-spacing="2">ONO TAPE</text>
  <text x="810" y="168" fill="#23352b" font-family="monospace" font-size="13" font-weight="700">A</text>
</svg>
