<svg xmlns="http://www.w3.org/2000/svg" width="880" height="302" viewBox="0 0 880 302" role="img" aria-labelledby="title description">
  <title id="title">Jeff Sia Yu Heng</title>
  <desc id="description">Full Stack AI Engineer and creator of ONOTAPE. An ivory ONOTAPE C60 cassette with two reels that turn briefly at startup.</desc>
  <defs>
    <linearGradient id="case" x2=".2" y2="1"><stop stop-color="#f3f1e9"/><stop offset="1" stop-color="#cfcec4"/></linearGradient>
    <pattern id="vents" width="7" height="6" patternUnits="userSpaceOnUse"><rect width="3" height="2" x="2" y="2" rx="1" fill="#9fa198"/></pattern>
    <linearGradient id="body" x2="0" y2="1">
      <stop stop-color="#f1eee2"/>
      <stop offset="1" stop-color="#bcbfb2"/>
    </linearGradient>
    <linearGradient id="paper" x2="1" y2="1">
      <stop stop-color="#b8c9b3"/>
      <stop offset="1" stop-color="#799581"/>
    </linearGradient>
    <g id="hub">
      <circle r="16" fill="#8f9e94" stroke="#c3cdc4" stroke-width="1.2"/>
      <circle r="10" fill="#25352b"/>
      <path d="M0-7v4m6 7L3 2m-9 2 3-2" stroke="#bac8be" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="fastener">
      <circle r="3.2" fill="#8d968c" stroke="#e4e7dc" stroke-width=".6"/>
      <path d="M-1.5.6l3-1.2" stroke="#414b43" stroke-width=".8"/>
    </g>
    <g id="screw"><circle r="3" fill="#b0b2a6" stroke="#f5f3ea"/><path d="M-1.5.7l3-1.4" stroke="#5d685f" stroke-width="1"/></g>
    <style>
      @keyframes wind { from { transform: rotate(0); } to { transform: rotate(610deg); } }
      .reel { transform-origin: 0 0; animation: wind 3.8s cubic-bezier(.17,.63,.28,1) both; }
      .takeup { animation-duration: 3.5s; }
      @media (prefers-reduced-motion: reduce) { .reel { animation: none; } }
    </style>
  </defs>
  <rect x="3" y="5" width="874" height="294" rx="21" fill="#97998f"/>
  <rect x="1" y="1" width="878" height="289" rx="21" fill="url(#case)" stroke="#afafa2"/>
  <rect x="11" y="11" width="858" height="269" rx="15" fill="none" stroke="#faf8ef"/>
  <path d="M29 241h822" stroke="#b8b9ae"/>
  <use href="#screw" x="29" y="29"/><use href="#screw" x="851" y="29"/>
  <use href="#screw" x="29" y="266"/><use href="#screw" x="851" y="266"/>
  <rect x="52" y="255" width="81" height="14" rx="2" fill="url(#vents)"/>
  <rect x="747" y="255" width="81" height="14" rx="2" fill="url(#vents)"/>
  <g font-family="system-ui, -apple-system, sans-serif" fill="#222925">
    <text x="57" y="112" font-size="51" font-weight="700" letter-spacing="-1.5">Jeff Sia Yu Heng</text>
    <text x="60" y="151" font-size="23" font-weight="500" fill="#374a3e">Full Stack AI Engineer</text>
    <text x="60" y="181" font-size="17" fill="#4b5b50">Creator of ONOTAPE</text>
  </g>
  <path d="M60 209h42m9 0h11" stroke="#4e765e" stroke-width="2" stroke-linecap="round"/>
  <g transform="translate(474 38) scale(1.14)">
    <rect x="3" y="7" width="292" height="166" rx="11" fill="#07100b" opacity=".65"/>
    <rect width="292" height="166" rx="10" fill="url(#body)" stroke="#f8f5e9"/>
    <rect x="13" y="14" width="266" height="110" rx="5" fill="url(#paper)" stroke="#667e6d"/>
    <path d="M29 46h234M29 53h234M29 110h234" stroke="#3f5c4b" opacity=".5"/>
    <text x="29" y="38" fill="#253d2f" font-family="monospace" font-size="15" font-weight="700">ONO</text>
    <text x="235" y="38" fill="#253d2f" font-family="monospace" font-size="13">C60</text>
    <rect x="71" y="64" width="150" height="37" rx="17" fill="#1d2c24" stroke="#556c60"/>
    <path d="M89 72h114m-114 21h114" stroke="#ae8765" stroke-width="2"/>
    <g transform="translate(90 82)"><g class="reel"><use href="#hub"/></g></g>
    <g transform="translate(202 82)"><g class="reel takeup"><use href="#hub"/></g></g>
    <path d="M70 164l15-33h122l15 33z" fill="#b3b9ad" stroke="#818d83"/>
    <path d="M104 149h84" stroke="#68786c" stroke-width="3" stroke-dasharray="5 7"/>
    <use href="#fastener" x="8" y="8"/>
    <use href="#fastener" x="284" y="8"/>
    <use href="#fastener" x="8" y="158"/>
    <use href="#fastener" x="284" y="158"/>
    <use href="#fastener" x="146" y="139"/>
  </g>
</svg>
