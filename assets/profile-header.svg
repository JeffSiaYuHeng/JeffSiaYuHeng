<svg xmlns="http://www.w3.org/2000/svg" width="880" height="302" viewBox="0 0 880 302" role="img" aria-labelledby="title description">
  <title id="title">Jeff Sia Yu Heng</title>
  <desc id="description">Full Stack AI Engineer and creator of ONOTAPE. An ivory tape deck with two reels that turn briefly at startup.</desc>
  <defs>
    <linearGradient id="case" x2=".2" y2="1"><stop stop-color="#f3f1e9"/><stop offset="1" stop-color="#cfcec4"/></linearGradient>
    <linearGradient id="face" x2="0" y2="1"><stop stop-color="#e7e4d7"/><stop offset="1" stop-color="#a9aba0"/></linearGradient>
    <linearGradient id="window" x2="1" y2="1"><stop stop-color="#29342d"/><stop offset=".55" stop-color="#151d18"/><stop offset="1" stop-color="#26362d"/></linearGradient>
    <pattern id="vents" width="7" height="6" patternUnits="userSpaceOnUse"><rect width="3" height="2" x="2" y="2" rx="1" fill="#9fa198"/></pattern>
    <g id="reel">
      <circle r="35" fill="#b6bdb3" stroke="#e0e3db" stroke-width="1.2"/>
      <circle r="29" fill="#414c44" stroke="#929f94"/>
      <circle r="18" fill="#19251e" stroke="#7b8c80"/>
      <path d="M0-14v6m12 15-5-3m-19 3 5-3" stroke="#c1ccbf" stroke-width="4" stroke-linecap="round"/>
      <circle r="4" fill="#97a79a"/>
    </g>
    <g id="screw"><circle r="3" fill="#b0b2a6" stroke="#f5f3ea"/><path d="M-1.5.7l3-1.4" stroke="#5d685f" stroke-width="1"/></g>
    <style>
      @keyframes wind { from { transform: rotate(0); } to { transform: rotate(610deg); } }
      @keyframes rise { from { transform: scaleY(.1); opacity: .35; } to { transform: scaleY(1); opacity: 1; } }
      .reel { transform-origin: 0 0; animation: wind 3.8s cubic-bezier(.17,.63,.28,1) both; }
      .takeup { animation-duration: 3.5s; }
      .meter { transform-origin: center bottom; transform-box: fill-box; animation: rise 1.3s .25s ease-out both; }
      @media (prefers-reduced-motion: reduce) { .reel, .meter { animation: none; } }
    </style>
  </defs>
  <rect x="3" y="5" width="874" height="294" rx="21" fill="#97998f"/>
  <rect x="1" y="1" width="878" height="289" rx="21" fill="url(#case)" stroke="#afafa2"/>
  <rect x="11" y="11" width="858" height="269" rx="15" fill="none" stroke="#faf8ef"/>
  <path d="M29 241h822" stroke="#b8b9ae"/>
  <use href="#screw" x="29" y="29"/><use href="#screw" x="851" y="29"/>
  <use href="#screw" x="29" y="266"/><use href="#screw" x="851" y="266"/>
  <rect x="52" y="255" width="81" height="14" rx="2" fill="url(#vents)"/>
  <rect x="747" y="255" width="81" height="14" rx="2" fill="url(#vents)"/>
  <g font-family="system-ui, -apple-system, sans-serif" fill="#222925">
    <text x="57" y="112" font-size="51" font-weight="700" letter-spacing="-1.5">Jeff Sia Yu Heng</text>
    <text x="60" y="151" font-size="23" font-weight="500" fill="#374a3e">Full Stack AI Engineer</text>
    <text x="60" y="181" font-size="17" fill="#4b5b50">Creator of ONOTAPE</text>
  </g>
  <path d="M60 209h42m9 0h11" stroke="#4e765e" stroke-width="2" stroke-linecap="round"/>
  <rect x="470" y="41" width="349" height="176" rx="11" fill="#989e93" stroke="#777f74"/>
  <rect x="474" y="45" width="341" height="168" rx="9" fill="url(#face)" stroke="#e8e6da"/>
  <rect x="489" y="57" width="311" height="126" rx="7" fill="url(#window)" stroke="#4f6055"/>
  <path d="M504 62h279m-279 114h279" stroke="#697c70" opacity=".4"/>
  <path d="M549 83h190m-190 74h190" stroke="#745640" stroke-width="3"/>
  <circle cx="549" cy="120" r="44" fill="#292823" stroke="#87745a" stroke-width="3"/>
  <circle cx="739" cy="120" r="44" fill="#292823" stroke="#87745a" stroke-width="3"/>
  <g transform="translate(549 120)"><g class="reel"><use href="#reel"/></g></g>
  <g transform="translate(739 120)"><g class="reel takeup"><use href="#reel"/></g></g>
  <path d="M608 137h73" stroke="#527260" stroke-width="1"/>
  <path class="meter" d="M612 132v-9h5v9zm10 0v-15h5v15zm10 0v-23h5v23zm10 0v-34h5v34zm10 0v-27h5v27zm10 0v-20h5v20zm10 0v-13h5v13z" fill="#a1e8b6"/>
  <circle cx="506" cy="198" r="4" fill="#31543e"/><circle cx="506" cy="198" r="2" fill="#b1ebbd"/>
  <text x="520" y="202" fill="#303a32" font-family="monospace" font-size="12" letter-spacing="1.4">ONOTAPE</text>
  <path d="M746 193h36m-36 4h36m-36 4h36" stroke="#6e7b70" stroke-width="1.2" stroke-dasharray="2 3"/>
</svg>
