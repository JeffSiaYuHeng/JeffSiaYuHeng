<svg xmlns="http://www.w3.org/2000/svg" width="880" height="225" viewBox="0 0 880 225" role="img" aria-labelledby="title description">
  <title id="title">Jeff Sia Yu Heng</title>
  <desc id="description">Full Stack AI Engineer and creator of ONOTAPE. A softly lit digital instrument panel.</desc>
  <defs>
    <linearGradient id="panel" x2="1" y2="1">
      <stop stop-color="#152522"/>
      <stop offset="1" stop-color="#09100f"/>
    </linearGradient>
    <linearGradient id="beam">
      <stop stop-color="#74f1bf" stop-opacity="0"/>
      <stop offset=".75" stop-color="#74f1bf" stop-opacity=".8"/>
      <stop offset="1" stop-color="#74f1bf"/>
    </linearGradient>
    <clipPath id="trace"><rect x="612" y="34" width="230" height="155" rx="5"/></clipPath>
    <style>
      @keyframes sweep { from { transform: translateX(-225px); } to { transform: translateX(245px); } }
      .scan { animation: sweep 3s ease-out 1 both; }
      @media (prefers-reduced-motion: reduce) { .scan { animation: none; display: none; } }
    </style>
  </defs>
  <rect width="880" height="225" rx="14" fill="url(#panel)"/>
  <rect x="1" y="1" width="878" height="223" rx="13" fill="none" stroke="#365951"/>
  <path d="M30 31v163" stroke="#83f7c9" stroke-width="3"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <text x="52" y="103" fill="#f2f8f5" font-size="46" font-weight="700">Jeff Sia Yu Heng</text>
    <text x="54" y="143" fill="#9de3ca" font-size="19">Full Stack AI Engineer</text>
    <text x="54" y="175" fill="#b0c9c0" font-size="17">Creator of ONOTAPE</text>
  </g>
  <rect x="612" y="34" width="230" height="155" rx="5" fill="#0c1715" stroke="#2f4941"/>
  <g clip-path="url(#trace)">
    <path d="M612 72h230m-230 40h230m-230 40h230M650 34v155m40-155v155m40-155v155m40-155v155m40-155v155" stroke="#233b34"/>
    <path d="M627 137h30l17-28 20 40 20-64 19 51 17-14h39l15-22h23" fill="none" stroke="#77e9ba" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect class="scan" x="612" y="34" width="82" height="155" fill="url(#beam)" opacity=".13"/>
  </g>
</svg>
